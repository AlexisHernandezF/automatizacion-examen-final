name: Deployment Pipeline

on:
  push:
    branches:
      - "feature/deployment-pipeline"

  workflow_dispatch:

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Construir proyecto
        run: mvn -B clean package -DskipTests

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar Acceptance Tests
        run: mvn -B -Dtest=CalculadoraAcceptanceTest test

  deploy-test:
    name: Deploy Test Environment
    runs-on: ubuntu-latest
    needs: acceptance-tests

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generar artefacto
        run: mvn -B package -DskipTests

      - name: Crear ambiente de prueba
        run: mkdir -p deployment/test

      - name: Desplegar artefacto
        run: cp target/*.jar deployment/test/

      - name: Verificar despliegue
        run: |
          echo "Contenido del ambiente de prueba:"
          ls -la deployment/test
          test -n "$(find deployment/test -name '*.jar' -print -quit)"
          echo "Despliegue en ambiente de prueba completado correctamente"