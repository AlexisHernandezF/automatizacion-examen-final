name: Deployment Pipeline

on:
  push:
    branches:
      - "feature/deployment-pipeline"

  workflow_dispatch:

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Construir proyecto
        run: mvn -B clean package -DskipTests

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar Acceptance Tests
        run: mvn -B -Dtest=CalculadoraAcceptanceTest test

  deploy-test:
    name: Deploy Test Environment
    runs-on: ubuntu-latest
    needs: acceptance-tests

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generar artefacto
        run: mvn -B package -DskipTests

      - name: Crear ambiente de prueba
        run: mkdir -p deployment/test

      - name: Desplegar artefacto
        run: cp target/*.jar deployment/test/

      - name: Verificar despliegue
        run: |
          echo "Contenido del ambiente de prueba:"
          ls -la deployment/test
          test -n "$(find deployment/test -name '*.jar' -print -quit)"
          echo "Despliegue en ambiente de prueba completado correctamente"

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: deploy-test

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generar artefacto
        run: mvn -B package -DskipTests

      - name: Preparar ambiente Blue
        run: |
          mkdir -p deployment/blue
          cp target/*.jar deployment/blue/
          echo "VERSION=BLUE" > deployment/blue/version.txt
          echo "Version estable preparada:"
          cat deployment/blue/version.txt

      - name: Desplegar nueva version Green
        run: |
          mkdir -p deployment/green
          cp target/*.jar deployment/green/
          echo "VERSION=GREEN" > deployment/green/version.txt
          echo "Nueva version desplegada:"
          cat deployment/green/version.txt

      - name: Activar version Green
        run: |
          rm -rf deployment/active
          cp -r deployment/green deployment/active
          echo "Version activa:"
          cat deployment/active/version.txt

      - name: Validar despliegue Green
        run: |
          test -f deployment/active/version.txt
          grep -q "VERSION=GREEN" deployment/active/version.txt
          test -n "$(find deployment/active -name '*.jar' -print -quit)"
          echo "Version GREEN validada correctamente"

      - name: Ejecutar rollback hacia Blue
        run: |
          echo "Ejecutando rollback desde GREEN hacia BLUE..."
          rm -rf deployment/active
          cp -r deployment/blue deployment/active
          echo "Rollback ejecutado"

      - name: Verificar rollback
        run: |
          echo "Version activa despues del rollback:"
          cat deployment/active/version.txt
          grep -q "VERSION=BLUE" deployment/active/version.txt
          test -n "$(find deployment/active -name '*.jar' -print -quit)"
          echo "Rollback a BLUE completado correctamente"